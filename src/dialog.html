<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Manager</title>
  <script>
    const TREE_DATA = __TREE_DATA__;

    // { deviceHandleId, trackHandleId, typeKey, displayName }
    let selected = null;
    let query = "";

    function postToHost(msg) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
        window.webkit.messageHandlers.live.postMessage(msg);
      } else if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(msg);
      }
    }

    function send(result) {
      postToHost({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function selectDevice(device) {
      selected = device;
      document.querySelectorAll(".device-row").forEach(r => r.classList.remove("selected"));
      const el = document.querySelector(`[data-handle="${device.deviceHandleId}"]`);
      if (el) el.classList.add("selected");
      document.querySelectorAll("[data-action]").forEach(b => b.removeAttribute("disabled"));
      document.getElementById("hint").style.display = "none";
    }

    function performAction(action) {
      if (!selected) return;
      if (action === "disable" || action === "enable" || action === "delete") {
        send({ action, deviceHandleId: selected.deviceHandleId, trackHandleId: selected.trackHandleId });
      } else {
        send({ action, typeKey: selected.typeKey });
      }
    }

    // ── Tree rendering ────────────────────────────────────────────────────

    function matchesQuery(name) {
      return name.toLowerCase().includes(query.toLowerCase());
    }

    function trackHasMatch(track) {
      if (track.devices.some(d => matchesQuery(d.displayName))) return true;
      return track.children.some(trackHasMatch);
    }

    function renderTree() {
      const container = document.getElementById("tree");
      container.innerHTML = "";

      const visibleTracks = query
        ? TREE_DATA.tracks.filter(trackHasMatch)
        : TREE_DATA.tracks;
      const visibleReturns = query
        ? TREE_DATA.returnTracks.filter(trackHasMatch)
        : TREE_DATA.returnTracks;
      const mainHasMatch = !query || trackHasMatch(TREE_DATA.mainTrack);

      if (visibleTracks.length > 0) {
        renderSection(container, visibleTracks, "Tracks", 0);
      }
      if (visibleReturns.length > 0) {
        renderSection(container, visibleReturns, "Return Tracks", 0);
      }
      if (mainHasMatch && (TREE_DATA.mainTrack.devices.length > 0 || TREE_DATA.mainTrack.children.length > 0)) {
        renderSection(container, [TREE_DATA.mainTrack], "Main Track", 0);
      }
    }

    function renderSection(container, tracks, label, depth) {
      const section = document.createElement("div");
      section.className = "section";

      const header = document.createElement("div");
      header.className = "section-header";
      header.textContent = label;
      section.appendChild(header);

      tracks.forEach(t => renderTrack(section, t, depth));
      container.appendChild(section);
    }

    function renderTrack(container, track, depth) {
      const visibleDevices = query
        ? track.devices.filter(d => matchesQuery(d.displayName))
        : track.devices;

      const visibleChildren = query
        ? track.children.filter(trackHasMatch)
        : track.children;

      const wrapper = document.createElement("div");
      wrapper.className = "track-wrapper";

      // Track header row
      const header = document.createElement("div");
      header.className = `track-row kind-${track.kind}`;
      header.style.paddingLeft = `${8 + depth * 14}px`;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "▾";

      const nameSpan = document.createElement("span");
      nameSpan.className = "track-name";
      nameSpan.textContent = track.name;

      const badge = document.createElement("span");
      badge.className = `badge badge-${track.kind}`;
      badge.textContent =
        track.kind === "group" ? "GRP"
        : track.kind === "midi" ? "MIDI"
        : track.kind === "audio" ? "AUDIO"
        : track.kind === "return" ? "RTN"
        : "MAIN";

      header.appendChild(arrow);
      header.appendChild(nameSpan);
      header.appendChild(badge);

      // Collapsible content
      const content = document.createElement("div");
      content.className = "track-content";

      visibleDevices.forEach(device => {
        const row = document.createElement("button");
        row.className = "device-row";
        if (selected && selected.deviceHandleId === device.deviceHandleId) {
          row.classList.add("selected");
        }
        row.dataset.handle = device.deviceHandleId;
        row.style.paddingLeft = `${20 + (depth + 1) * 14}px`;
        row.textContent = device.displayName;
        row.onclick = () => selectDevice(device);
        content.appendChild(row);
      });

      visibleChildren.forEach(child => renderTrack(content, child, depth + 1));

      // Collapse toggle
      let collapsed = false;
      header.onclick = () => {
        collapsed = !collapsed;
        content.style.display = collapsed ? "none" : "";
        arrow.textContent = collapsed ? "▸" : "▾";
      };

      wrapper.appendChild(header);
      wrapper.appendChild(content);
      container.appendChild(wrapper);
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderTree();

      document.getElementById("search").addEventListener("input", e => {
        query = e.target.value;
        renderTree();
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") send({ action: "cancel" });
      });
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    button { font: inherit; cursor: pointer; }
    input  { font: inherit; }

    :root {
      --bg:           hsl(0, 0%, 21%);
      --bg-input:     hsl(0, 0%, 12%);
      --bg-btn:       hsl(0, 0%, 16%);
      --bg-btn-hover: hsl(0, 0%, 19%);
      --bg-section:   hsl(0, 0%, 18%);
      --border:       hsl(0, 0%, 7%);
      --text:         hsl(0, 0%, 71%);
      --text-dim:     hsl(0, 0%, 41%);
      --text-on-accent: hsl(0, 0%, 7%);
      --accent:       hsl(31, 100%, 67%);
      --danger:       hsl(0, 72%, 58%);
      --danger-hover: hsl(0, 72%, 50%);
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: "AbletonSansSmall", system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }

    body {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 8px;
    }

    .title { font-size: 1.1rem; }

    .search-input {
      width: 100%;
      height: 22px;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 8px;
      outline: none;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { outline: 2px solid var(--text-dim); outline-offset: 0; }

    /* Main area */
    .main {
      display: flex;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    /* Tree */
    .tree-wrap {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      background: var(--bg-input);
    }

    /* Section label ("Tracks", "Return Tracks", "Main Track") */
    .section-header {
      padding: 4px 8px;
      color: var(--text-dim);
      background: var(--bg-section);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    /* Track rows */
    .track-row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
    }
    .track-row:hover { background: var(--bg-btn-hover); }
    .track-content > .track-wrapper:last-child > .track-row { border-bottom: none; }

    .arrow { color: var(--text-dim); font-size: 0.85rem; flex-shrink: 0; }
    .track-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Track type badges */
    .badge {
      font-size: 0.8rem;
      padding: 1px 4px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-right: 6px;
      color: var(--text-on-accent);
    }
    .badge-midi   { background: hsl(31, 80%, 55%); }
    .badge-audio  { background: hsl(200, 50%, 45%); }
    .badge-group  { background: hsl(270, 30%, 50%); }
    .badge-return { background: hsl(150, 30%, 40%); }
    .badge-main   { background: hsl(0, 0%, 35%); color: var(--text); }

    /* Device rows */
    .device-row {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-align: left;
      height: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-content > .device-row:last-child,
    .track-content > .track-wrapper:last-child .device-row:last-child { border-bottom: none; }
    .device-row:hover   { background: var(--bg-btn-hover); }
    .device-row.selected { background: var(--accent); color: var(--text-on-accent); }

    /* Action sidebar */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 108px;
      flex-shrink: 0;
    }

    .action-label {
      font-size: 0.9rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 0;
    }

    .action-sep {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .spacer { flex: 1; }

    .btn {
      font-size: 1rem;
      background: var(--bg-btn);
      color: var(--text);
      border: 1px solid var(--border);
      height: 20px;
      padding: 0 10px;
      border-radius: 10px;
      user-select: none;
      white-space: nowrap;
      width: 100%;
    }
    .btn:hover  { background: var(--bg-btn-hover); }
    .btn:active { background: var(--accent); color: var(--text-on-accent); }
    .btn:focus  { outline: 2px solid var(--text-dim); }
    .btn:disabled { opacity: 0.3; pointer-events: none; }

    .btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
    .btn-danger:hover  { background: var(--danger-hover); }
    .btn-danger:active { background: var(--danger-hover); color: #fff; }

    .hint { font-size: 1rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="title">Manage Device Instances</div>

  <input id="search" class="search-input" type="text" placeholder="Search devices…" autocomplete="off" />

  <div class="main">
    <div class="tree-wrap" id="tree"></div>

    <div class="actions">
      <div class="action-label">This device</div>
      <button class="btn" data-action disabled onclick="performAction('disable')">Disable</button>
      <button class="btn" data-action disabled onclick="performAction('enable')">Enable</button>
      <button class="btn btn-danger" data-action disabled onclick="performAction('delete')">Delete</button>

      <div class="action-sep"></div>

      <div class="action-label">All instances</div>
      <button class="btn" data-action disabled onclick="performAction('disable-all')">Disable All</button>
      <button class="btn" data-action disabled onclick="performAction('enable-all')">Enable All</button>
      <button class="btn btn-danger" data-action disabled onclick="performAction('delete-all')">Delete All</button>

      <div class="spacer"></div>
      <button class="btn" onclick="send({ action: 'cancel' })">Exit</button>
    </div>
  </div>

  <div class="hint" id="hint">Select a device from the project tree</div>
</body>
</html>
